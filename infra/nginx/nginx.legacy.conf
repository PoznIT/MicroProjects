events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript text/html text/plain;

    # Use Docker's internal DNS for upstream resolution
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # ── Auth subrequest (internal only) ──────────────────────────────
        location = /verify {
            internal;
            set $auth_upstream http://auth:3000;
            proxy_pass              $auth_upstream/verify;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
        }

        # ── Unprotected: login / logout / shared assets ───────────────────
        location /login {
            set $auth_upstream http://auth:3000;
            proxy_pass $auth_upstream;
            proxy_set_header Host $http_host;
        }

        location /logout {
            set $auth_upstream http://auth:3000;
            proxy_pass $auth_upstream;
            proxy_set_header Host $http_host;
        }

        location /shared/ {
            root /var/www/portal;
            try_files $uri =404;
        }

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";

        # ── Auth redirect target ──────────────────────────────────────────
        location @require_login {
            return 302 $scheme://$http_host/login;
        }

        # ── Protected: landing page ───────────────────────────────────────
        location / {
            auth_request /verify;
            error_page 401 = @require_login;

            root /var/www/portal;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # ── Protected: TimePunch ──────────────────────────────────────────
        location /timepunch/ {
            auth_request /verify;
            error_page 401 = @require_login;

            alias /var/www/apps/TimePunch/;
            index index.html;
            try_files $uri $uri/ index.html;
        }

        # ── Protected: YTAudio (backend service) ──────────────────────────
        location /ytaudio/ {
            auth_request /verify;
            error_page 401 = @require_login;

            # Variable upstream (for Docker DNS) means proxy_pass can't rewrite
            # the URI itself — strip the /ytaudio/ prefix explicitly first.
            set $ytaudio_upstream http://ytaudio:3000;
            rewrite ^/ytaudio/(.*)$ /$1 break;
            proxy_pass $ytaudio_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;

            # Downloads can be large and slow; relax buffering/timeouts.
            proxy_buffering off;
            proxy_read_timeout 600s;
            client_max_body_size 16k;
        }

        # ── Protected: ValueScope (backend service) ───────────────────────
        location /valuescope/ {
            auth_request /verify;
            error_page 401 = @require_login;

            set $valuescope_upstream http://valuescope:3000;
            rewrite ^/valuescope/(.*)$ /$1 break;
            proxy_pass $valuescope_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;

            # yfinance lookups can take a few seconds.
            proxy_read_timeout 60s;
            client_max_body_size 8k;
        }
    }
}
