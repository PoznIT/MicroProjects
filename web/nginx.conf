# nginx config for the `web` container: serve the built React SPA with a
# history-API fallback so client-side routes (/valuescope, /ytaudio, …) resolve
# to index.html. API and auth routing is handled by the gateway proxy in front.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # text/html is always gzipped implicitly — listing it triggers a warning.
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
