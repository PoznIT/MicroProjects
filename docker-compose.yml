services:
  auth:
    build: ./infra/auth
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 5s
      retries: 3
      start_period: 10s

  # Unified Python backend (FastAPI) — serves /api/valuescope, /api/ytaudio,
  # /api/timepunch. Bundles yt-dlp + yfinance.
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 10s
      retries: 3
      start_period: 15s

  # Unified React frontend (Vite build served by nginx).
  web:
    build: ./web
    restart: unless-stopped
    # busybox wget (nginx:alpine) needs flags separated — the combined -qO-
    # form only works with GNU wget.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 10s
      retries: 3
      start_period: 10s

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      api:
        condition: service_healthy
      # web is a static nginx that's ready immediately — start is enough; no
      # need to gate the proxy on its healthcheck.
      web:
        condition: service_started
    restart: unless-stopped
