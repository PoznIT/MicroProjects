events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript text/html text/plain application/json;

    # Use Docker's internal DNS for upstream resolution.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # ── Auth subrequest (internal only) ──────────────────────────────
        location = /verify {
            internal;
            set $auth_upstream http://auth:3000;
            proxy_pass              $auth_upstream/verify;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
        }

        # ── Unprotected: login / logout ───────────────────────────────────
        location /login {
            set $auth_upstream http://auth:3000;
            proxy_pass $auth_upstream;
            proxy_set_header Host $http_host;
        }
        location /logout {
            set $auth_upstream http://auth:3000;
            proxy_pass $auth_upstream;
            proxy_set_header Host $http_host;
        }

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";

        # ── Auth redirect target ──────────────────────────────────────────
        location @require_login {
            return 302 $scheme://$http_host/login;
        }

        # ── Protected: CSV trade import ───────────────────────────────────
        # A full IBKR trade-history CSV exceeds the tight default API body cap;
        # grant this one endpoint a larger limit (the app caps at 5 MB too).
        location = /api/valuescope/ibkr/import-csv {
            auth_request /verify;
            error_page 401 = @require_login;

            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            client_max_body_size 5m;
        }

        # ── Protected: API (FastAPI) ──────────────────────────────────────
        # Path is preserved (FastAPI routes are mounted under /api/...).
        location /api/ {
            auth_request /verify;
            error_page 401 = @require_login;

            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            client_max_body_size 16k;
        }

        # ── Protected: React SPA (everything else) ────────────────────────
        location / {
            auth_request /verify;
            error_page 401 = @require_login;

            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
