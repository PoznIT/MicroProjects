<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValueScope · MicroProjects</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230b0c0e' width='100' height='100' rx='20'/><text y='.9em' font-size='64' x='12'>📊</text></svg>">
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 24px;
      transition: background .15s, color .15s;
    }
    .topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 12px 20px; }
    .topbar a { color: var(--dim); text-decoration: none; font-size: 13px; }
    .topbar a:hover { color: var(--text); }
    .btn-ghost {
      background: none; border: 1px solid var(--border); color: var(--dim);
      font-family: var(--mono); font-size: 13px; padding: 5px 10px;
      border-radius: 6px; cursor: pointer;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--dim); }

    .logo { font-size: 22px; font-weight: 600; letter-spacing: -.5px; margin-bottom: 6px; }
    .logo span { color: var(--accent); }
    .tagline { color: var(--dim); font-size: 12px; margin-bottom: 32px; text-align: center; }

    .search {
      display: flex; gap: 8px; width: 100%; max-width: 480px; margin-bottom: 8px;
    }
    .combo { position: relative; flex: 1; }
    .combo input {
      width: 100%; background: var(--s1); border: 1px solid var(--border);
      color: var(--text); font-family: var(--mono); font-size: 15px;
      padding: 12px 14px; border-radius: 8px; outline: none;
    }
    .combo input:focus { border-color: var(--accent); }

    /* Autocomplete dropdown */
    .suggest {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
      background: var(--s1); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .suggest.open { display: block; }
    .sug-item {
      display: flex; align-items: baseline; gap: 10px; padding: 10px 14px;
      cursor: pointer; border-bottom: 1px solid var(--border);
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover, .sug-item.active { background: var(--s2); }
    .sug-item .s { font-family: var(--sans); font-weight: 600; font-size: 13px; color: var(--text); min-width: 64px; }
    .sug-item .n { color: var(--dim); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sug-item .x { color: var(--dim2); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
    .sug-empty { padding: 12px 14px; color: var(--dim); font-size: 12px; }
    .sug-loading { display: flex; align-items: center; gap: 8px; padding: 12px 14px; color: var(--dim); font-size: 12px; }

    /* In-field spinner while a search request is in flight */
    .combo .in-spin {
      position: absolute; top: 50%; right: 13px; transform: translateY(-50%);
      width: 13px; height: 13px; border: 2px solid var(--dim2);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; display: none;
    }
    .combo.loading .in-spin { display: block; }
    .combo.loading input { padding-right: 36px; }
    .btn-go {
      background: var(--accent); color: var(--bg); border: none; border-radius: 8px;
      padding: 0 20px; font-family: var(--mono); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
    }
    .btn-go:hover { opacity: .9; }
    .btn-go:disabled { opacity: .5; cursor: not-allowed; }

    .status { margin-top: 14px; font-size: 12px; min-height: 16px; }
    .status.err { color: var(--red); }
    .status.work { color: var(--dim); }
    .spinner {
      display: inline-block; width: 11px; height: 11px; margin-right: 6px;
      border: 2px solid var(--dim2); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -1px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Dashboard ─────────────────────────────────────────────── */
    .dash { width: 100%; max-width: 860px; margin-top: 28px; display: none; }

    .head {
      display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
      background: var(--s1); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px 28px; margin-bottom: 18px;
    }
    .head .id { flex: 1; min-width: 200px; }
    .head .sym { font-family: var(--sans); font-size: 22px; font-weight: 700; }
    .head .nm { color: var(--text); font-size: 13px; margin-top: 2px; }
    .head .sub { color: var(--dim); font-size: 11px; margin-top: 6px; line-height: 1.5; }
    .head .px { text-align: right; }
    .head .px .v { font-size: 20px; font-weight: 600; font-family: var(--sans); }
    .head .px .l { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }

    /* Composite score ring */
    .score-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .ring { position: relative; width: 92px; height: 92px; }
    .ring svg { transform: rotate(-90deg); }
    .ring .track { stroke: var(--border); }
    .ring .val-num {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .ring .val-num b { font-family: var(--sans); font-size: 24px; font-weight: 700; line-height: 1; }
    .ring .val-num s { font-size: 9px; color: var(--dim); text-decoration: none; }
    .verdict { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

    .group { margin-bottom: 18px; }
    .group-title {
      color: var(--dim); font-size: 10px; text-transform: uppercase;
      letter-spacing: .12em; margin: 0 2px 8px;
    }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
    .metric {
      background: var(--s1); border: 1px solid var(--border);
      border-left: 3px solid var(--dim2); border-radius: 8px; padding: 12px 14px;
    }
    .metric.good { border-left-color: var(--accent); }
    .metric.ok   { border-left-color: var(--blue); }
    .metric.bad  { border-left-color: var(--red); }
    .metric.na   { border-left-color: var(--dim2); opacity: .65; }
    .metric .k { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
    .metric .v { font-family: var(--sans); font-size: 19px; font-weight: 600; margin-top: 4px; }
    .metric.good .v { color: var(--accent); }
    .metric.ok   .v { color: var(--blue); }
    .metric.bad  .v { color: var(--red); }
    .metric .t { color: var(--dim); font-size: 10px; margin-top: 5px; line-height: 1.45; }

    .disclaimer { color: var(--dim2); font-size: 10px; margin-top: 8px; line-height: 1.5; max-width: 860px; text-align: center; }
    footer { margin-top: auto; padding-top: 48px; color: var(--dim); font-size: 11px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/">← MicroProjects</a>
    <button class="btn-ghost" id="theme-toggle" onclick="toggleTheme()">🌙</button>
  </div>

  <div class="logo">Value<span>Scope</span></div>
  <div class="tagline">fundamental metrics & a quick value-investing read for any ticker</div>

  <form class="search" id="search" autocomplete="off">
    <div class="combo">
      <input id="sym" placeholder="Search company or ticker — e.g. Apple or AAPL"
             autocomplete="off" spellcheck="false" maxlength="64"
             role="combobox" aria-autocomplete="list" aria-expanded="false">
      <span class="in-spin" id="in-spin" aria-hidden="true"></span>
      <div class="suggest" id="suggest" role="listbox"></div>
    </div>
    <button class="btn-go" id="go" type="submit">Analyze</button>
  </form>
  <div class="status" id="status"></div>

  <div class="dash" id="dash"></div>

  <footer>PoznIT / MicroProjects</footer>

  <script src="/shared/theme.js"></script>
  <script>
    initTheme();

    // ── Value-investing rubric ───────────────────────────────────────
    // dir: 'low' = lower is better, 'high' = higher is better.
    // good / ok are the threshold boundaries. fmt formats the raw value.
    // optional: true means a missing/neutral value isn't penalized in the score.
    const GROUPS = [
      { title: 'Valuation', items: [
        { key: 'trailingPE',  label: 'P/E (TTM)',   dir: 'low',  good: 15,   ok: 25,   fmt: 'x',   note: 'Price vs. earnings. <15 is classically cheap.' },
        { key: 'forwardPE',   label: 'Fwd P/E',     dir: 'low',  good: 15,   ok: 25,   fmt: 'x',   note: 'Price vs. expected earnings.' },
        { key: 'priceToBook', label: 'P/B',         dir: 'low',  good: 1.5,  ok: 3,    fmt: 'x',   note: 'Price vs. book value. <1.5 favored by Graham.' },
        { key: 'pegRatio',    label: 'PEG',         dir: 'low',  good: 1,    ok: 2,    fmt: 'x',   note: 'P/E adjusted for growth. <1 is attractive.' },
      ]},
      { title: 'Profitability', items: [
        { key: 'returnOnEquity', label: 'ROE',      dir: 'high', good: 0.15, ok: 0.08, fmt: '%',  note: 'Return on shareholder equity. >15% is strong.' },
        { key: 'returnOnAssets', label: 'ROA',      dir: 'high', good: 0.07, ok: 0.03, fmt: '%',  note: 'How efficiently assets generate profit.' },
        { key: 'profitMargins',  label: 'Net Margin', dir: 'high', good: 0.15, ok: 0.05, fmt: '%', note: 'Profit per dollar of revenue.' },
      ]},
      { title: 'Financial Health', items: [
        { key: 'debtToEquity', label: 'Debt / Equity', dir: 'low',  good: 0.5, ok: 1.0, fmt: 'x', note: 'Leverage. <0.5x is conservative.' },
        { key: 'currentRatio', label: 'Current Ratio', dir: 'high', good: 2,   ok: 1,   fmt: 'x', note: 'Short-term assets vs. liabilities. >2 is safe.' },
      ]},
      { title: 'Cash & Dividends', items: [
        { key: 'freeCashflowYield', label: 'FCF Yield', dir: 'high', good: 0.06, ok: 0.03, fmt: '%', note: 'Free cash flow vs. market cap. >6% is rich.' },
        { key: 'dividendYield',     label: 'Div Yield', dir: 'high', good: 0.03, ok: 0.01, fmt: '%', optional: true, note: 'Cash returned to holders. Optional for value.' },
      ]},
      { title: 'Growth', items: [
        { key: 'revenueGrowth',  label: 'Revenue Growth', dir: 'high', good: 0.10, ok: 0.03, fmt: '%', note: 'Year-over-year revenue change.' },
        { key: 'earningsGrowth', label: 'Earnings Growth', dir: 'high', good: 0.10, ok: 0,   fmt: '%', note: 'Year-over-year earnings change.' },
      ]},
    ];

    function rate(val, m) {
      if (val === null || val === undefined) return 'na';
      // Negative P/E, PEG, P/B etc. signal losses / odd accounting — treat as bad.
      if (m.dir === 'low' && val <= 0) return 'bad';
      if (m.dir === 'low')  return val <= m.good ? 'good' : (val <= m.ok ? 'ok' : 'bad');
      /* high */            return val >= m.good ? 'good' : (val >= m.ok ? 'ok' : 'bad');
    }

    function fmtVal(val, m) {
      if (val === null || val === undefined) return '—';
      if (m.fmt === '%') return (val * 100).toFixed(1) + '%';
      if (m.fmt === 'x') return val.toFixed(2) + '×';
      return String(val);
    }

    function fmtMoney(n, cur) {
      if (n === null || n === undefined) return '—';
      const sign = cur === 'USD' ? '$' : (cur ? cur + ' ' : '');
      const abs = Math.abs(n);
      if (abs >= 1e12) return sign + (n / 1e12).toFixed(2) + 'T';
      if (abs >= 1e9)  return sign + (n / 1e9).toFixed(2) + 'B';
      if (abs >= 1e6)  return sign + (n / 1e6).toFixed(2) + 'M';
      return sign + n.toFixed(2);
    }

    const $sym = document.getElementById('sym');
    const $go = document.getElementById('go');
    const $status = document.getElementById('status');
    const $dash = document.getElementById('dash');
    const $suggest = document.getElementById('suggest');
    const $combo = document.querySelector('.combo');

    function setStatus(msg, cls) {
      $status.className = 'status ' + (cls || '');
      $status.innerHTML = msg;
    }

    // ── Autocomplete ────────────────────────────────────────────────
    let sugItems = [];      // current result objects
    let activeIdx = -1;     // keyboard-highlighted row
    let searchTimer;
    let searchSeq = 0;      // guards against out-of-order responses

    function setLoading(on) {
      $combo.classList.toggle('loading', on);
    }

    function closeSuggest() {
      searchSeq++;          // cancel ownership of any in-flight request
      setLoading(false);
      $suggest.classList.remove('open');
      $sym.setAttribute('aria-expanded', 'false');
      activeIdx = -1;
    }

    // Open the dropdown with a "Searching…" placeholder while the request runs.
    function showSearching() {
      sugItems = [];
      activeIdx = -1;
      $suggest.innerHTML = '<div class="sug-loading"><span class="spinner"></span>Searching…</div>';
      $suggest.classList.add('open');
      $sym.setAttribute('aria-expanded', 'true');
    }

    function renderSuggest(items) {
      sugItems = items;
      activeIdx = -1;
      if (!items.length) {
        $suggest.innerHTML = '<div class="sug-empty">No matching companies found.</div>';
      } else {
        $suggest.innerHTML = items.map((it, i) => `
          <div class="sug-item" role="option" data-i="${i}">
            <span class="s">${esc(it.symbol)}</span>
            <span class="n">${esc(it.name)}</span>
            <span class="x">${esc(it.exchange)}</span>
          </div>`).join('');
      }
      $suggest.classList.add('open');
      $sym.setAttribute('aria-expanded', 'true');
    }

    $sym.addEventListener('input', () => {
      const q = $sym.value.trim();
      clearTimeout(searchTimer);
      if (q.length < 1) {
        searchSeq++;            // supersede any in-flight request
        setLoading(false);
        closeSuggest();
        return;
      }
      searchTimer = setTimeout(() => runSearch(q), 250);
    });

    async function runSearch(q) {
      const seq = ++searchSeq;
      setLoading(true);
      showSearching();
      try {
        const r = await fetch('api/search?q=' + encodeURIComponent(q));
        const j = await r.json();
        // A newer request has taken over — it owns the spinner, so leave it be.
        if (seq !== searchSeq) return;
        setLoading(false);
        if (!r.ok || j.error) { closeSuggest(); return; }
        renderSuggest(j.results || []);
      } catch {
        if (seq === searchSeq) { setLoading(false); closeSuggest(); }
      }
    }

    // Click a suggestion → analyze it.
    $suggest.addEventListener('mousedown', e => {
      const row = e.target.closest('.sug-item');
      if (!row) return;
      e.preventDefault();
      pick(sugItems[Number(row.dataset.i)]);
    });

    function pick(item) {
      if (!item) return;
      $sym.value = item.symbol;
      closeSuggest();
      analyze(item.symbol);
    }

    // Keyboard navigation within the dropdown.
    $sym.addEventListener('keydown', e => {
      const open = $suggest.classList.contains('open') && sugItems.length;
      if (!open) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        activeIdx += (e.key === 'ArrowDown' ? 1 : -1);
        if (activeIdx < 0) activeIdx = sugItems.length - 1;
        if (activeIdx >= sugItems.length) activeIdx = 0;
        [...$suggest.children].forEach((c, i) => c.classList.toggle('active', i === activeIdx));
      } else if (e.key === 'Enter' && activeIdx >= 0) {
        e.preventDefault();
        pick(sugItems[activeIdx]);
      } else if (e.key === 'Escape') {
        closeSuggest();
      }
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.combo')) closeSuggest();
    });

    document.getElementById('search').addEventListener('submit', e => {
      e.preventDefault();
      // If a suggestion is highlighted, use it; otherwise treat the raw text
      // as a ticker (lets power users type AAPL + Enter without picking).
      if (activeIdx >= 0 && sugItems[activeIdx]) { pick(sugItems[activeIdx]); return; }
      closeSuggest();
      analyze();
    });

    async function analyze(symbolOverride) {
      const symbol = (symbolOverride || $sym.value).trim().toUpperCase();
      if (!symbol) { setStatus('Search for a company or enter a ticker first.', 'err'); return; }

      $go.disabled = true;
      $dash.style.display = 'none';
      setStatus('<span class="spinner"></span>Fetching fundamentals for ' + symbol + '…', 'work');

      try {
        const r = await fetch('api/metrics?symbol=' + encodeURIComponent(symbol));
        const j = await r.json();
        if (!r.ok || j.error) {
          setStatus(j.error || 'Could not fetch data.', 'err');
          return;
        }
        setStatus('', '');
        render(j);
      } catch {
        setStatus('Network error — please retry.', 'err');
      } finally {
        $go.disabled = false;
      }
    }

    function render(data) {
      const M = data.metrics || {};

      // ── Composite score: weighted good=2 / ok=1 / bad=0 across rated metrics.
      let pts = 0, max = 0;
      GROUPS.forEach(g => g.items.forEach(m => {
        const r = rate(M[m.key], m);
        if (r === 'na') return;
        if (m.optional && r === 'bad') return; // don't punish a missing dividend
        max += 2;
        pts += (r === 'good' ? 2 : r === 'ok' ? 1 : 0);
      }));
      const score = max ? Math.round((pts / max) * 100) : 0;

      let verdict, color;
      if (score >= 70)      { verdict = 'Attractive';  color = 'var(--accent)'; }
      else if (score >= 45) { verdict = 'Mixed';       color = 'var(--blue)'; }
      else                  { verdict = 'Unattractive'; color = 'var(--red)'; }

      const R = 40, C = 2 * Math.PI * R;
      const dash = (score / 100) * C;

      const sub = [data.sector, data.industry].filter(Boolean).join(' · ');

      let html = `
        <div class="head">
          <div class="id">
            <div class="sym">${data.symbol}</div>
            <div class="nm">${esc(data.name)}</div>
            <div class="sub">${esc(sub)}${sub ? '<br>' : ''}Market cap ${fmtMoney(data.marketCap, data.currency)}</div>
          </div>
          <div class="px">
            <div class="l">Price</div>
            <div class="v">${fmtMoney(data.price, data.currency)}</div>
          </div>
          <div class="score-wrap">
            <div class="ring">
              <svg width="92" height="92" viewBox="0 0 92 92">
                <circle class="track" cx="46" cy="46" r="${R}" fill="none" stroke-width="8"/>
                <circle cx="46" cy="46" r="${R}" fill="none" stroke="${color}" stroke-width="8"
                        stroke-linecap="round" stroke-dasharray="${dash} ${C}"/>
              </svg>
              <div class="val-num"><b style="color:${color}">${score}</b><s>/ 100</s></div>
            </div>
            <div class="verdict" style="color:${color}">${verdict}</div>
          </div>
        </div>`;

      GROUPS.forEach(g => {
        html += `<div class="group"><div class="group-title">${g.title}</div><div class="cards">`;
        g.items.forEach(m => {
          const val = M[m.key];
          const cls = rate(val, m);
          html += `
            <div class="metric ${cls}">
              <div class="k">${m.label}</div>
              <div class="v">${fmtVal(val, m)}</div>
              <div class="t">${m.note}</div>
            </div>`;
        });
        html += `</div></div>`;
      });

      html += `<div class="disclaimer">
        Color coding compares each metric against common value-investing rules of thumb
        (green = favorable, blue = acceptable, red = caution, grey = no data). Thresholds are
        generic and ignore sector context. Informational only — not investment advice.
      </div>`;

      $dash.innerHTML = html;
      $dash.style.display = 'block';
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
  </script>
</body>
</html>
