<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTAudio · MicroProjects</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230b0c0e' width='100' height='100' rx='20'/><text y='.9em' font-size='70' x='18'>🎵</text></svg>">
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 24px;
      transition: background .15s, color .15s;
    }
    .topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 12px 20px; }
    .topbar a { color: var(--dim); text-decoration: none; font-size: 13px; }
    .topbar a:hover { color: var(--text); }
    .btn-ghost {
      background: none; border: 1px solid var(--border); color: var(--dim);
      font-family: var(--mono); font-size: 13px; padding: 5px 10px;
      border-radius: 6px; cursor: pointer;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--dim); }

    .logo { font-size: 22px; font-weight: 600; letter-spacing: -.5px; margin-bottom: 6px; }
    .logo span { color: var(--accent); }
    .tagline { color: var(--dim); font-size: 12px; margin-bottom: 40px; }

    .panel {
      width: 100%; max-width: 560px;
      background: var(--s1); border: 1px solid var(--border);
      border-radius: 12px; padding: 28px;
    }
    label { display: block; color: var(--dim); font-size: 11px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
    input[type=url] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: var(--mono); font-size: 14px;
      padding: 12px 14px; border-radius: 8px; outline: none;
    }
    input[type=url]:focus { border-color: var(--accent); }

    .formats { display: flex; gap: 8px; margin: 20px 0 24px; }
    .formats label {
      flex: 1; margin: 0; cursor: pointer; text-align: center;
      border: 1px solid var(--border); border-radius: 8px; padding: 12px 8px;
      font-size: 12px; color: var(--text); text-transform: none; letter-spacing: 0;
      transition: border-color .15s, background .15s;
    }
    .formats input { display: none; }
    .formats label small { display: block; color: var(--dim); font-size: 10px; margin-top: 4px; }
    .formats input:checked + span { color: var(--accent); }
    .formats label:has(input:checked) { border-color: var(--accent); background: var(--s2); }

    .btn-go {
      width: 100%; background: var(--accent); color: var(--bg);
      border: none; border-radius: 8px; padding: 13px;
      font-family: var(--mono); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
    }
    .btn-go:hover { opacity: .9; }
    .btn-go:disabled { opacity: .5; cursor: not-allowed; }

    .status { margin-top: 18px; font-size: 12px; min-height: 18px; line-height: 1.5; }
    .status.err { color: var(--red); }
    .status.ok { color: var(--accent); }
    .status.work { color: var(--dim); }
    .spinner {
      display: inline-block; width: 11px; height: 11px; margin-right: 6px;
      border: 2px solid var(--dim2); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -1px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .meta { margin-top: 16px; display: none; gap: 12px; align-items: center; }
    .meta img { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; }
    .meta .t { font-family: var(--sans); font-size: 13px; color: var(--text); }
    .meta .u { color: var(--dim); font-size: 11px; }

    footer { margin-top: auto; padding-top: 48px; color: var(--dim); font-size: 11px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/">← MicroProjects</a>
    <button class="btn-ghost" id="theme-toggle" onclick="toggleTheme()">🌙</button>
  </div>

  <div class="logo">YT<span>Audio</span></div>
  <div class="tagline">download the audio track from any YouTube video</div>

  <div class="panel">
    <label for="url">YouTube URL</label>
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" spellcheck="false">

    <div class="meta" id="meta">
      <img id="meta-thumb" alt="">
      <div>
        <div class="t" id="meta-title"></div>
        <div class="u" id="meta-uploader"></div>
      </div>
    </div>

    <div class="formats" style="margin-top:20px">
      <label><input type="radio" name="format" value="best" checked><span>Best</span><small>original codec</small></label>
      <label><input type="radio" name="format" value="mp3"><span>MP3</span><small>320 kbps</small></label>
      <label><input type="radio" name="format" value="flac"><span>FLAC</span><small>lossless</small></label>
    </div>

    <button class="btn-go" id="go">Download audio</button>
    <div class="status" id="status"></div>
  </div>

  <footer>PoznIT / MicroProjects</footer>

  <script src="/shared/theme.js"></script>
  <script>
    initTheme();

    const $url = document.getElementById('url');
    const $go = document.getElementById('go');
    const $status = document.getElementById('status');
    const $meta = document.getElementById('meta');

    function setStatus(msg, cls) {
      $status.className = 'status ' + (cls || '');
      $status.innerHTML = msg;
    }

    function fmtDuration(s) {
      if (!s) return '';
      const m = Math.floor(s / 60), sec = String(s % 60).padStart(2, '0');
      return `${m}:${sec}`;
    }

    let infoTimer;
    $url.addEventListener('input', () => {
      clearTimeout(infoTimer);
      $meta.style.display = 'none';
      const url = $url.value.trim();
      if (!url) return;
      infoTimer = setTimeout(() => fetchInfo(url), 500);
    });

    async function fetchInfo(url) {
      try {
        const r = await fetch('api/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        if (!r.ok) return;
        const j = await r.json();
        document.getElementById('meta-title').textContent = j.title || '';
        document.getElementById('meta-uploader').textContent =
          [j.uploader, fmtDuration(j.duration)].filter(Boolean).join(' · ');
        const thumb = document.getElementById('meta-thumb');
        if (j.thumbnail) { thumb.src = j.thumbnail; thumb.style.display = ''; }
        else thumb.style.display = 'none';
        $meta.style.display = 'flex';
      } catch { /* non-fatal */ }
    }

    $go.addEventListener('click', download);
    $url.addEventListener('keydown', e => { if (e.key === 'Enter') download(); });

    async function download() {
      const url = $url.value.trim();
      const format = document.querySelector('input[name=format]:checked').value;
      if (!url) { setStatus('Paste a YouTube URL first.', 'err'); return; }

      $go.disabled = true;
      setStatus('<span class="spinner"></span>Fetching & converting — this can take a moment…', 'work');

      try {
        const r = await fetch('api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, format }),
        });

        if (!r.ok) {
          let msg = 'Download failed.';
          try { msg = (await r.json()).error || msg; } catch {}
          setStatus(msg, 'err');
          return;
        }

        const blob = await r.blob();
        const disp = r.headers.get('Content-Disposition') || '';
        const match = disp.match(/filename\*?=(?:UTF-8'')?\"?([^\";]+)/i);
        const name = match ? decodeURIComponent(match[1]) : 'audio';

        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);

        setStatus('✓ Saved ' + name, 'ok');
      } catch (e) {
        setStatus('Network error — please retry.', 'err');
      } finally {
        $go.disabled = false;
      }
    }
  </script>
</body>
</html>
